<!DOCTYPE html>
<html>
<head>
<style>
.container { width: 32px; height: 96px; background: rgba(0,0,0,0.5); border-radius: 9999px; display: flex; align-items: center; justify-content: center; }
.slider { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: none; border-radius: 9999px; }
.track-container { position: relative; height: 64px; width: 4px; display: flex; justify-content: center; }
.track-bg { position: absolute; top: 0; bottom: 0; width: 4px; background: rgba(255,255,255,0.2); border-radius: 9999px; pointer-events: none; }
.track-fill { position: absolute; bottom: 0; width: 4px; background: white; border-radius: 9999px; pointer-events: none; height: 50%; }
.thumb { position: absolute; width: 12px; height: 12px; background: white; border-radius: 50%; pointer-events: none; bottom: calc(50% - 6px); }
</style>
</head>
<body>
<div class="container">
  <div class="slider" id="slider">
    <div class="track-container" id="track">
      <div class="track-bg"></div>
      <div class="track-fill" id="fill"></div>
      <div class="thumb" id="thumb"></div>
    </div>
  </div>
</div>
<script>
  let value = 50;
  const slider = document.getElementById('slider');
  const track = document.getElementById('track');
  const fill = document.getElementById('fill');
  const thumb = document.getElementById('thumb');

  function handlePointer(e) {
    const rect = track.getBoundingClientRect();
    const y = e.clientY - rect.top;
    let percent = 100 - (y / rect.height) * 100;
    percent = Math.max(0, Math.min(100, percent));
    value = percent;
    fill.style.height = `${value}%`;
    thumb.style.bottom = `calc(${value}% - 6px)`;
  }

  slider.addEventListener('pointerdown', (e) => {
    slider.setPointerCapture(e.pointerId);
    handlePointer(e);
  });
  slider.addEventListener('pointermove', (e) => {
    if (e.buttons > 0) handlePointer(e);
  });
</script>
</body>
</html>
